<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      html, body { margin: 0; overflow: hidden; }
      body { touch-action: none; }

      #ytOverlay {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0,0,0,0.65);
        z-index: 9999;
        pointer-events: none;
      }
      #ytOverlay.show { display: flex; pointer-events: auto; }
    </style>
  </head>

  <body>
    <a-scene
      mindar-image="imageTargetSrc: ./targets0.mind;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
    >
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- TARGET -->
      <a-entity mindar-image-target="targetIndex: 0">

        <!-- 👇 CONTENEDOR (CLAVE) -->
        <a-entity id="modelContainer">
          <a-gltf-model
            id="modelo"
            src="./modcarro.glb"
            scale="5 5 5"
            gesture-controls
          ></a-gltf-model>
        </a-entity>

      </a-entity>
    </a-scene>

    <script>
      AFRAME.registerComponent("gesture-controls", {
        init: function () {
          this.container = document.querySelector("#modelContainer").object3D;

          this.pointers = new Map();
          this.isPinching = false;
          this.isRotating = false;

          this.prevDist = 0;
          this.prevX = 0;
          this.prevY = 0;

          this.onPointerDown = this.onPointerDown.bind(this);
          this.onPointerMove = this.onPointerMove.bind(this);
          this.onPointerUp = this.onPointerUp.bind(this);

          const canvas = this.el.sceneEl.renderer.domElement;

          canvas.addEventListener("pointerdown", this.onPointerDown);
          window.addEventListener("pointermove", this.onPointerMove);
          window.addEventListener("pointerup", this.onPointerUp);
        },

        _dist: function () {
          const [a, b] = Array.from(this.pointers.values());
          return Math.hypot(a.x - b.x, a.y - b.y);
        },

        onPointerDown: function (e) {
          this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

          if (this.pointers.size === 2) {
            this.isPinching = true;
            this.prevDist = this._dist();
          }

          if (this.pointers.size === 1) {
            this.isRotating = true;
            this.prevX = e.clientX;
            this.prevY = e.clientY;
          }
        },

        onPointerMove: function (e) {
          if (!this.pointers.has(e.pointerId)) return;
          this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

          // ZOOM
          if (this.isPinching && this.pointers.size === 2) {
            const dist = this._dist();
            const delta = dist - this.prevDist;
            this.prevDist = dist;

            const scale = this.el.getAttribute("scale") || { x: 1, y: 1, z: 1 };
            const factor = 1 + delta * 0.002;

            const newScale = {
              x: scale.x * factor,
              y: scale.y * factor,
              z: scale.z * factor
            };

            document.querySelector("#modelContainer").setAttribute("scale", newScale);
            return;
          }

          // ROTACIÓN
          if (this.isRotating && this.pointers.size === 1) {
            const dx = e.clientX - this.prevX;
            const dy = e.clientY - this.prevY;

            this.prevX = e.clientX;
            this.prevY = e.clientY;

            // Horizontal
            this.container.rotation.y += dx * 0.008;

            // Detectar vista trasera
            const rotY = this.container.rotation.y;
            const norm = ((rotY % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
            const back = norm > Math.PI / 2 && norm < 3 * Math.PI / 2;

            const correctedDy = back ? -dy : dy;

            // Vertical
            this.container.rotation.x += correctedDy * 0.008;

            // Limitar
            const max = Math.PI / 2;
            this.container.rotation.x = Math.max(-max, Math.min(max, this.container.rotation.x));
          }
        },

        onPointerUp: function (e) {
          this.pointers.delete(e.pointerId);
          this.isPinching = false;
          this.isRotating = false;
        }
      });
    </script>
  </body>
</html>
