<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      html, body { margin: 0; overflow: hidden; }
      body { touch-action: none; }

      /* Overlay YouTube: una sola fuente de verdad = clase .show */
      #ytOverlay {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0,0,0,0.65);
        z-index: 9999;
        pointer-events: none;
      }
      #ytOverlay.show {
        display: flex;
        pointer-events: auto;
      }

      #ytCard {
        width: min(92vw, 900px);
        aspect-ratio: 16/9;
        background: #000;
        border-radius: 14px;
        overflow: hidden;
      }

      #ytClose {
        position: fixed;
        top: 16px;
        right: 16px;
        font-size: 18px;
        padding: 10px 14px;
        border: 0;
        border-radius: 10px;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <a-scene
      id="scene"
      mindar-image="imageTargetSrc: ./targets0.mind;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      renderer="precision: mediump; antialias: false; alpha: true; logarithmicDepthBuffer: false;"
      shadow="type: none"
    >
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target 0: modelo -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-gltf-model
          id="modelo"
          src="./modcarro.glb"
          position="0 0 0"
          rotation="0 0 0"
          scale="5 5 5"
          gesture-controls="debug: false; tapaName: tapa_v31; tapaAxis: x; tapaMinDeg: 0; tapaMaxDeg: 180; tapaDegPerPx: 0.5;"
        ></a-gltf-model>
      </a-entity>

      <!-- Target 1: solo para disparar el video -->
      <a-entity id="target1" mindar-image-target="targetIndex: 1"></a-entity>
    </a-scene>

    <!-- Overlay YouTube -->
    <div id="ytOverlay" aria-hidden="true">
      <div id="ytCard">
        <iframe
          id="ytFrame"
          width="100%"
          height="100%"
          frameborder="0"
          allow="autoplay; encrypted-media; picture-in-picture"
          allowfullscreen
        ></iframe>
      </div>
      <button id="ytClose" type="button">Cerrar ✕</button>
    </div>

    <script>
      AFRAME.registerComponent("gesture-controls", {
        schema: {
          /* Debug */
          debug: { type: "boolean", default: false },

          /* Zoom */
          zoomSpeed: { type: "number", default: 0.0025 },
          minScale:  { type: "number", default: 0.8 },
          maxScale:  { type: "number", default: 15.0 },

          /* Rotate (modelo completo) */
          rotateSpeed: { type: "number", default: 0.008 },
          minMovePx:   { type: "number", default: 1 },

          /* Tapa */
          tapaName:     { type: "string", default: "tapa_v31" },
          tapaAxis:     { type: "string", default: "x" },
          tapaMinDeg:   { type: "number", default: 0 },
          tapaMaxDeg:   { type: "number", default: 180 },
          tapaDegPerPx: { type: "number", default: 0.5 },

          /* Control del gesto de tapa: usar eje dominante */
          tapaUseDominantAxis: { type: "boolean", default: true }, // mejora estabilidad
          tapaDominant: { type: "string", default: "y" } // "x" o "y"
        },

        init: function () {
          this.canvas = null;
          this.camera = null;

          /* Estado de punteros */
          this.pointers = new Map();
          this.isPinching = false;
          this.isRotating = false;
          this.draggingPart = null;

          /* Estado zoom/rotación */
          this.prevDist = 0;
          this.prevX = 0;

          /* Estado tapa */
          this.tapaAngleDeg = 0;
          this.tapaStartAngleDeg = 0;
          this.tapaAccumPx = 0;
          this.tapaLastX = 0;
          this.tapaLastY = 0;
          this.tapaIntent = null; // "open" o "close"

          /* 3D */
          this.modelRoot = null;
          this.tapaObj = null;
          this.raycaster = new THREE.Raycaster();
          this.ndc = new THREE.Vector2();

          /* Bind handlers */
          this.onPointerDown = this.onPointerDown.bind(this);
          this.onPointerMove = this.onPointerMove.bind(this);
          this.onPointerUp   = this.onPointerUp.bind(this);

          /* Cuando el glTF esté listo */
          this.el.addEventListener("model-loaded", () => {
            this.modelRoot = this.el.object3D;

            if (this.data.debug) {
              this.modelRoot.add(new THREE.AxesHelper(0.6));
            }

            this.tapaObj = this.modelRoot.getObjectByName(this.data.tapaName);

            if (this.tapaObj) {
              if (this.data.debug) {
                this.tapaObj.add(new THREE.AxesHelper(0.3));
              }
              console.log("✅ Tapa encontrada:", this.data.tapaName);
            } else {
              console.warn("⚠️ No encontré la tapa con nombre:", this.data.tapaName);
            }
          });

          /* Enganchar eventos cuando la escena/renderer estén listos */
          this.el.sceneEl.addEventListener("loaded", () => {
            const scene = this.el.sceneEl;
            if (!scene.renderer || !scene.renderer.domElement || !scene.camera) {
              console.warn("⚠️ Scene loaded, pero renderer/camera no listos aún");
              return;
            }
            this.canvas = scene.renderer.domElement;
            this.camera = scene.camera;

            this.canvas.style.touchAction = "none";

            /* Usamos capture true para interceptar antes */
            this.canvas.addEventListener("pointerdown", this.onPointerDown, { passive: false, capture: true });
            window.addEventListener("pointermove", this.onPointerMove, { passive: false, capture: true });
            window.addEventListener("pointerup", this.onPointerUp, { passive: false, capture: true });
            window.addEventListener("pointercancel", this.onPointerUp, { passive: false, capture: true });

            console.log("✅ Pointer events activos (sin polling)");
          });
        },

        remove: function () {
          /* Limpieza para evitar fugas y dobles listeners */
          if (!this.canvas) return;
          this.canvas.removeEventListener("pointerdown", this.onPointerDown, true);
          window.removeEventListener("pointermove", this.onPointerMove, true);
          window.removeEventListener("pointerup", this.onPointerUp, true);
          window.removeEventListener("pointercancel", this.onPointerUp, true);
        },

        clamp: function (v, min, max) {
          return Math.max(min, Math.min(max, v));
        },

        _dist2Pointers: function () {
          const arr = Array.from(this.pointers.values());
          if (arr.length < 2) return 0;
          const dx = arr[1].x - arr[0].x;
          const dy = arr[1].y - arr[0].y;
          return Math.hypot(dx, dy);
        },

        _intersectModel: function (clientX, clientY) {
          if (!this.canvas || !this.camera || !this.modelRoot) return [];
          const rect = this.canvas.getBoundingClientRect();

          this.ndc.x = ((clientX - rect.left) / rect.width) * 2 - 1;
          this.ndc.y = -(((clientY - rect.top) / rect.height) * 2 - 1);

          this.modelRoot.updateMatrixWorld(true);
          this.raycaster.setFromCamera(this.ndc, this.camera);
          return this.raycaster.intersectObject(this.modelRoot, true);
        },

        _hitIsTapa: function (hitObj) {
          if (!this.tapaObj) return false;
          let o = hitObj;
          while (o) {
            if (o === this.tapaObj) return true;
            o = o.parent;
          }
          return false;
        },

        _applyTapaAngleDeg: function (deg) {
          if (!this.tapaObj) return;
          this.tapaAngleDeg = this.clamp(deg, this.data.tapaMinDeg, this.data.tapaMaxDeg);

          const rad = -THREE.MathUtils.degToRad(this.tapaAngleDeg); // invertido
          const axis = (this.data.tapaAxis || "x").toLowerCase();

          if (axis === "x") this.tapaObj.rotation.x = rad;
          else if (axis === "y") this.tapaObj.rotation.y = rad;
          else this.tapaObj.rotation.z = rad;
        },

        _dominantDelta: function (dx, dy) {
          if (!this.data.tapaUseDominantAxis) return Math.hypot(dx, dy);
          const dom = (this.data.tapaDominant || "y").toLowerCase();
          return dom === "x" ? dx : dy;
        },

        onPointerDown: function (e) {
          if (e.pointerType !== "touch") return;
          if (e.cancelable) e.preventDefault();

          /* Captura sobre canvas cuando exista */
          try { this.canvas && this.canvas.setPointerCapture(e.pointerId); } catch (_) {}

          this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

          /* Pinch (2 dedos) */
          if (this.pointers.size === 2) {
            this.isPinching = true;
            this.isRotating = false;
            this.draggingPart = null;
            this.prevDist = this._dist2Pointers();
            return;
          }

          /* Un dedo: tapa o rotación */
          if (this.pointers.size === 1) {
            const hits = this._intersectModel(e.clientX, e.clientY);
            const touchedTapa = hits.length > 0 && this._hitIsTapa(hits[0].object);

            if (touchedTapa) {
              this.draggingPart = "tapa";
              this.isRotating = false;
              this.isPinching = false;

              const mid = (this.data.tapaMinDeg + this.data.tapaMaxDeg) / 2;
              this.tapaIntent = (this.tapaAngleDeg >= mid) ? "close" : "open";

              this.tapaStartAngleDeg = this.tapaAngleDeg;
              this.tapaAccumPx = 0;
              this.tapaLastX = e.clientX;
              this.tapaLastY = e.clientY;
              return;
            }

            this.draggingPart = null;
            this.isRotating = true;
            this.isPinching = false;
            this.prevX = e.clientX;
          }
        },

        onPointerMove: function (e) {
          if (e.pointerType !== "touch") return;
          if (!this.pointers.has(e.pointerId)) return;
          if (e.cancelable) e.preventDefault();

          this.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

          /* Pinch zoom: directo en object3D (más fluido) */
          if (this.isPinching && this.pointers.size === 2) {
            const dist = this._dist2Pointers();
            const delta = dist - this.prevDist;
            this.prevDist = dist;

            const factor = 1 + (delta * this.data.zoomSpeed);

            const obj = this.el.object3D;
            const nx = this.clamp(obj.scale.x * factor, this.data.minScale, this.data.maxScale);
            const ny = this.clamp(obj.scale.y * factor, this.data.minScale, this.data.maxScale);
            const nz = this.clamp(obj.scale.z * factor, this.data.minScale, this.data.maxScale);
            obj.scale.set(nx, ny, nz);
            return;
          }

          /* Tapa: usa eje dominante (más estable) */
          if (this.draggingPart === "tapa" && this.pointers.size === 1) {
            const dx = e.clientX - this.tapaLastX;
            const dy = e.clientY - this.tapaLastY;

            this.tapaLastX = e.clientX;
            this.tapaLastY = e.clientY;

            /* delta dominante */
            const domDelta = this._dominantDelta(dx, dy);

            /* umbral */
            if (Math.abs(domDelta) < 0.5) return;

            const mid = (this.data.tapaMinDeg + this.data.tapaMaxDeg) / 2;

            /* Convención: para "open" aumentamos ángulo con gesto en la dirección dominante negativa (dy<0 si dominant=y) */
            const direction = (this.data.tapaDominant || "y").toLowerCase();
            const goesOpen = direction === "y" ? (domDelta < 0) : (domDelta > 0);

            const stepPx = Math.abs(domDelta);

            if (this.tapaIntent === "open") {
              if (!goesOpen) return;
              this.tapaAccumPx += stepPx;
              const deltaDeg = this.tapaAccumPx * this.data.tapaDegPerPx;
              this._applyTapaAngleDeg(this.tapaStartAngleDeg + deltaDeg);
              return;
            } else {
              /* close */
              if (goesOpen) return; // en close, rechazamos dirección de abrir
              this.tapaAccumPx += stepPx;
              const deltaDeg = this.tapaAccumPx * this.data.tapaDegPerPx;
              const candidate = this.tapaStartAngleDeg - deltaDeg;

              /* Snap al mid si cruza */
              if (this.tapaStartAngleDeg > mid && candidate <= mid) {
                this._applyTapaAngleDeg(mid);
                this.tapaStartAngleDeg = mid;
                this.tapaAccumPx = 0;
                return;
              }

              this._applyTapaAngleDeg(candidate);
              return;
            }
          }

          /* Rotación del modelo (1 dedo) */
          if (this.isRotating && this.pointers.size === 1) {
            const dx = e.clientX - this.prevX;
            if (Math.abs(dx) < this.data.minMovePx) return;
            this.prevX = e.clientX;
            this.el.object3D.rotation.y += dx * this.data.rotateSpeed;
          }
        },

        onPointerUp: function (e) {
          if (e.pointerType !== "touch") return;
          if (e.cancelable) e.preventDefault();

          this.pointers.delete(e.pointerId);

          /* Si quedan 2 dedos (raro), recalcula pinch */
          if (this.pointers.size === 2) {
            this.isPinching = true;
            this.isRotating = false;
            this.draggingPart = null;
            this.prevDist = this._dist2Pointers();
            return;
          }

          this.isPinching = false;
          this.isRotating = false;
          this.draggingPart = null;
          this.prevDist = 0;

          this.tapaAccumPx = 0;
          this.tapaIntent = null;
        }
      });
    </script>

    <!-- Script YouTube (único, sin duplicados) -->
    <script>
      const scene = document.querySelector("#scene");

      scene.addEventListener("loaded", () => {
        const target1 = document.querySelector("#target1");
        const overlay = document.getElementById("ytOverlay");
        const frame = document.getElementById("ytFrame");
        const closeBtn = document.getElementById("ytClose");

        const VIDEO_ID = "0xKeIFzrVuo";
        const YT_URL = `https://www.youtube-nocookie.com/embed/${VIDEO_ID}?autoplay=1&playsinline=1&rel=0`;

        const openYT = () => {
          overlay.classList.add("show");
          frame.src = YT_URL;
          overlay.setAttribute("aria-hidden", "false");
          console.log("🎯 targetIndex 1 FOUND");
        };

        const closeYT = () => {
          frame.src = "";
          overlay.classList.remove("show");
          overlay.setAttribute("aria-hidden", "true");
          console.log("❌ targetIndex 1 LOST");
        };

        closeBtn.addEventListener("click", closeYT);
        overlay.addEventListener("click", (e) => {
          if (e.target === overlay) closeYT();
        });

        target1.addEventListener("targetFound", openYT);
        target1.addEventListener("targetLost", closeYT);

        console.log("✅ scene loaded, target1:", target1);
      });
    </script>
  </body>
</html>
